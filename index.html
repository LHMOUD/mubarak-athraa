<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دعوة زفاف مبارك وعذراء</title>
<meta name="description" content="يسعدنا دعوتكم لحضور حفل زفاف مبارك وعذراء — ٢٥ / ١١ — قاعة الخاتونه">
<meta property="og:title" content="دعوة زفاف مبارك وعذراء">
<meta property="og:description" content="٢٥ / ١١ — الساعة ٨ مساءً — قاعة الخاتونه">
<meta property="og:image" content="poster.jpg">
<meta name="theme-color" content="#EEE5D8">
<style>
@font-face{font-family:Alan;src:url(fonts/AlanSans-Light.ttf);font-weight:300}
@font-face{font-family:Alan;src:url(fonts/AlanSans-Regular.ttf);font-weight:400}
@font-face{font-family:Alan;src:url(fonts/AlanSans-Bold.ttf);font-weight:700}
@font-face{font-family:Alan;src:url(fonts/AlanSans-ExtraBold.ttf);font-weight:800}
:root{--bg:#EEE5D8;--card:#F6F0E6;--ink:#5E5648;--soft:#8D8468;--olive:#6F7449;--line:#C9BBAA}
@media (prefers-color-scheme:dark){:root{--bg:#2A2722;--card:#34302A;--ink:#EDE3D3;--soft:#B3A78C;--olive:#A5AB74;--line:#4C463C}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Alan,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto;padding:0 20px 40px}
section{padding:44px 0;text-align:center;border-bottom:1px solid var(--line)}
section:last-of-type{border:0}
.hero{padding-top:28px}
.video{position:relative;border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(60,45,30,.25);background:#000;aspect-ratio:9/16}
.video video{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(40,32,24,.25);border:0;cursor:pointer;transition:opacity .4s}
.play span{width:76px;height:76px;border-radius:50%;background:rgba(246,240,230,.92);display:grid;place-items:center}
.play svg{width:28px;fill:var(--olive);margin-right:-4px}
.play.hide{opacity:0;pointer-events:none}
.hint{font-size:13px;color:var(--soft);margin-top:12px}
.mono{height:150px;margin:0 auto 8px;display:block}
.small{font-weight:300;font-size:18px;color:var(--soft)}
h1{font-size:40px;font-weight:800;margin:6px 0;letter-spacing:.01em}
h1 i{font-style:normal;color:var(--olive);font-weight:300;margin:0 8px}
h2{font-size:22px;font-weight:700;color:var(--olive);margin-bottom:18px}
.date{font-size:56px;font-weight:800;letter-spacing:.12em;color:var(--olive);line-height:1.1;margin:6px 0}
.row{font-size:22px;margin:4px 0}
.row b{font-weight:800}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.cd div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 4px}
.cd b{display:block;font-size:30px;font-weight:800;color:var(--olive);font-variant-numeric:tabular-nums}
.cd span{font-size:13px;color:var(--soft)}
.btns{display:grid;gap:12px;margin-top:6px}
.btn{display:block;padding:15px;border-radius:14px;font:700 17px Alan,sans-serif;text-decoration:none;border:1.5px solid var(--olive);color:var(--olive);background:transparent;cursor:pointer}
.btn.fill{background:var(--olive);color:#fff}
.btn:active{transform:scale(.98)}
.note{font-weight:300;font-size:19px;color:var(--soft);margin-top:14px}
footer{text-align:center;padding:26px 0 8px;font-size:12px;letter-spacing:.16em;color:var(--soft);text-transform:uppercase;direction:ltr}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .9s ease,transform .9s ease}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>
<div class="wrap">

<section class="hero">
  <div class="video">
    <video id="v" src="invite.mp4" poster="poster.jpg" playsinline preload="metadata" loop></video>
    <button class="play" id="p" aria-label="تشغيل الدعوة"><span><svg viewBox="0 0 24 24"><path d="M5 3l16 9-16 9z"/></svg></span></button>
  </div>
  <p class="hint">اضغط لتشغيل الدعوة بالصوت</p>
</section>

<section class="reveal">
  <img class="mono" src="mono.png" alt="ع م">
  <p class="small">بقلوبٍ يملؤها الفرح يسعدنا دعوتكم لحضور حفل زفاف</p>
  <h1>مبارك<i>&amp;</i>عذراء</h1>
</section>

<section class="reveal">
  <h2>ويكون موعدنا</h2>
  <div class="date">٢٥ . ١١</div>
  <p class="row">الساعة <b>٨ مساءً</b></p>
  <p class="row">قاعة <b>الخاتونه</b></p>
</section>

<section class="reveal">
  <h2>باقي على الفرحة</h2>
  <div class="cd" id="cd">
    <div><b id="d">--</b><span>يوم</span></div>
    <div><b id="h">--</b><span>ساعة</span></div>
    <div><b id="m">--</b><span>دقيقة</span></div>
    <div><b id="s">--</b><span>ثانية</span></div>
  </div>
</section>

<section class="reveal">
  <div class="btns">
    <a class="btn fill" id="map" target="_blank" rel="noopener">الموقع على الخريطة</a>
    <a class="btn" id="cal" download="wedding-invitation.ics">أضف للتقويم</a>
    <button class="btn" id="share">شارك الدعوة</button>
  </div>
  <p class="note">وحضوركم يكمل فرحتنا<br>بانتظاركم بكل حب</p>
</section>

<footer>by: bluray media studio</footer>
</div>

<script>
// ---- video ----
const v=document.getElementById('v'),p=document.getElementById('p');
p.onclick=()=>{v.muted=false;v.play();p.classList.add('hide')};
v.onclick=()=>{if(v.paused){v.play();p.classList.add('hide')}else{v.pause();p.classList.remove('hide')}};

// ---- event ----
// ٢٥ نوفمبر، الساعة ٨ مساءً بتوقيت بغداد (UTC+3). عدّل السنة إذا لزم.
const YEAR=2026, TARGET=new Date(Date.UTC(YEAR,10,25,17,0,0));
const AR=n=>String(n).padStart(2,'0').replace(/\d/g,c=>'٠١٢٣٤٥٦٧٨٩'[c]);
function tick(){let ms=TARGET-Date.now();if(ms<0)ms=0;
  const s=Math.floor(ms/1000);
  d.textContent=AR(Math.floor(s/86400));h.textContent=AR(Math.floor(s%86400/3600));
  m.textContent=AR(Math.floor(s%3600/60));document.getElementById('s').textContent=AR(s%60);}
tick();setInterval(tick,1000);

// ---- map / calendar / share ----
document.getElementById('map').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('قاعة الخاتونه');
const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Bluray Media Studio//AR','BEGIN:VEVENT',
 'UID:wedding-'+YEAR+'@bluray','DTSTAMP:20260101T000000Z','DTSTART:'+YEAR+'1125T170000Z','DTEND:'+YEAR+'1125T210000Z',
 'SUMMARY:حفل زفاف مبارك وعذراء','LOCATION:قاعة الخاتونه','END:VEVENT','END:VCALENDAR'].join('\r\n');
document.getElementById('cal').href='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);
document.getElementById('share').onclick=async()=>{
  const data={title:'دعوة زفاف مبارك وعذراء',text:'يسعدنا دعوتكم لحضور حفل زفاف مبارك وعذراء — ٢٥/١١ — قاعة الخاتونه',url:location.href};
  if(navigator.share){try{await navigator.share(data)}catch(e){}}
  else location.href='https://wa.me/?text='+encodeURIComponent(data.text+'\n'+data.url);
};

// ---- scroll reveal ----
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
</body>
</html>
